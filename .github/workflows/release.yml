name: Build and Release Raspberry Pi Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - armv7-unknown-linux-gnueabihf   # 32-bit
          - aarch64-unknown-linux-gnu        # 64-bit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install just
        uses: extractions/setup-just@v1

      - name: Install cross
        run: cargo install cross

      - name: Build binary
        run: |
          if [ "${{ matrix.arch }}" = "aarch64-unknown-linux-gnu" ]; then
            just cross
          else
            just cross-32
          fi


      - name: Get arch shorthand
        id: arch
        run: |
          ARCH=$(echo "${{ matrix.arch }}" | cut -d'-' -f1)
          echo "ARCH=$ARCH" >> $GITHUB_OUTPUT

      - name: Bundle board definitions
        run: |
          mkdir -p dist/boards
          cp -r boards/* dist/boards/

      - name: Zip binary and boards
        run: |
          mkdir -p dist
          cp target/${{ matrix.arch }}/release/sequent-gateway dist/sequent-gateway
          zip -r dist/sequent-gateway-${{ steps.arch.outputs.ARCH }}.zip dist/sequent-gateway dist/boards

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sequent-gateway-${{ steps.arch.outputs.ARCH }}.zip
          path: dist/sequent-gateway-${{ steps.arch.outputs.ARCH }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/sequent-gateway-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}