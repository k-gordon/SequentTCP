name: Build and Release Raspberry Pi Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - armv7-unknown-linux-gnueabihf   # 32-bit
          - aarch64-unknown-linux-gnu        # 64-bit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install just
        uses: extractions/setup-just@v1

      - name: Install cross
        run: cargo install cross

      - name: Build binary
        run: |
          just cross-rpi --target ${{ matrix.arch }}

      - name: Rename binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.arch }}/release/sequent-gateway dist/sequent-gateway-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sequent-gateway-${{ matrix.arch }}
          path: dist/sequent-gateway-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/sequent-gateway-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}